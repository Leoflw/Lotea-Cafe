name: cafe_match_app
description: "CaféMatch — marketplace móvil de café colombiano (build de pruebas, datos en memoria)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado (todo en memoria, se pierde al cerrar la app)
  provider: ^6.1.2

  # UI / UX
  google_fonts: ^6.2.1
  flutter_card_swiper: ^7.0.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
